name: tsugiwa_metro
description: "Tsugiwa Metro - Japan train trip companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.2
  intl: any
  http: ^1.6.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  image: ^4.13.1
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/cities/
    - assets/cities/tokyo/
    - assets/cities/tottori/
    - assets/cities/osaka/
    - assets/cities/fukuoka/
    - assets/cities/sendai/
    - assets/cities/sapporo/
    - assets/art/
    - assets/art/landmarks/
    - assets/art/scenes/
    - assets/art/train3d/
    - assets/art/scenes_season/
    - assets/art/decor/
    - assets/art/marks/
    - assets/art/sky/
    - assets/art/trains/oni/
    - assets/art/trains/yako/
    - assets/art/trains/tenbo/
    - assets/art/cities/scenes/
    - assets/art/decor/vending_front/
    - assets/art/map_decor/
    - assets/art/map_seasons/
    - assets/art/map_tiles/
    - assets/art/anim/
    - assets/art/weather/
    - assets/art/widget/
    - assets/art/crowd/
    - assets/art/people/
    - assets/art/stickers/
    - assets/art/shinkansen/
    - assets/art/events/
    - assets/art/yellow_train/
    - assets/art/eki_in/
    - assets/art/train_dex/
    - assets/art/tottori/
    - assets/art/tottori/landmarks/
    - assets/art/tottori/map_tiles/
    - assets/art/tottori/diesel/
    - assets/art/tottori/sl/
    - assets/art/tottori/scenes/
    - assets/art/osaka/
    - assets/art/osaka/landmarks/
    - assets/art/osaka/map_tiles/
    - assets/art/fukuoka/
    - assets/art/fukuoka/landmarks/
    - assets/art/fukuoka/map_tiles/
    - assets/art/sendai/
    - assets/art/sendai/landmarks/
    - assets/art/sendai/map_tiles/
    - assets/art/sapporo/
    - assets/art/sapporo/landmarks/
    - assets/art/sapporo/map_tiles/
    - assets/my/
    - assets/sounds/
    - assets/fonts/licenses/
  fonts:
    # Pixel fonts, both SIL Open Font License (see assets/fonts/*OFL*).
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700
